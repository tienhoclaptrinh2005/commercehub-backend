server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5678/commercehub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

google:
  client-id: "1060424015252-neu3kv70tuss4g3md3g74njho7mihpja.apps.googleusercontent.com"

jwt:
  secret: ${JWT_SECRET:V29ya2luZ0hhcmRPbkNvbW1lcmNlSHViUHJvamVjdDIwMjZTZWN1cmVLZXlWMzg5NDU=}
  expiration: 900000 # Access Token 15 phút
  refreshExpiration: 604800000 # Thời gian sống của Refresh Token7 ngày = 604800000 ms

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:commercehub_refresh}
    # Localhost chạy HTTP phải để false. Production bắt buộc AUTH_COOKIE_SECURE=true.
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    max-age-seconds: 604800


#Local/development: SPRINGDOC_ENABLED=true.
#CI: giữ true vì có contract test kiểm tra /v3/api-docs.
#Production: nên đặt SPRINGDOC_ENABLED=false nếu không muốn công khai cấu trúc API.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

sepay:
  environment: ${SEPAY_ENVIRONMENT:sandbox}
  merchant-id: ${SEPAY_MERCHANT_ID:replace-with-sepay-sandbox-merchant-id}
  secret-key: ${SEPAY_SECRET_KEY:replace-with-sepay-sandbox-secret-key}
  ipn-secret: ${SEPAY_IPN_SECRET:replace-with-sepay-sandbox-ipn-secret}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
  # SePay chỉ callback tới URL public. Khi test local, thay ba URL này bằng domain tunnel HTTPS.
  success-url: ${SEPAY_SUCCESS_URL:http://localhost:3000/wallet/deposit?payment=success}
  error-url: ${SEPAY_ERROR_URL:http://localhost:3000/wallet/deposit?payment=error}
  cancel-url: ${SEPAY_CANCEL_URL:http://localhost:3000/wallet/deposit?payment=cancel}

commercehub:
  jobs:
    batch-size: ${JOB_BATCH_SIZE:200}
  dispute:
    seller-response-hours: ${DISPUTE_SELLER_RESPONSE_HOURS:24}
    warranty-processing-hours: ${DISPUTE_WARRANTY_PROCESSING_HOURS:24}
    buyer-confirmation-hours: ${DISPUTE_BUYER_CONFIRMATION_HOURS:24}
    admin-review-hours: ${DISPUTE_ADMIN_REVIEW_HOURS:72}

