server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5678/commercehub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

google:
  client-id: "1060424015252-neu3kv70tuss4g3md3g74njho7mihpja.apps.googleusercontent.com"

jwt:
  secret: ${JWT_SECRET:V29ya2luZ0hhcmRPbkNvbW1lcmNlSHViUHJvamVjdDIwMjZTZWN1cmVLZXlWMzg5NDU=}
  expiration: 900000 # Access Token 15 phút
  refreshExpiration: 604800000 # Thời gian sống của Refresh Token7 ngày = 604800000 ms

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:commercehub_refresh}
    # Localhost chạy HTTP phải để false. Production bắt buộc AUTH_COOKIE_SECURE=true.
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    max-age-seconds: 604800

vnpay:
  hash-secret: ${VNPAY_HASH_SECRET:CHUOI_BI_MAT_CUA_BAN_DO_VNPAY_CAP}
  tmn-code: ${VNPAY_TMN_CODE:MA_WEBSITE_VNPAY_CAP}
  pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"


