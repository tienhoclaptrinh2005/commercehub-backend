server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # Local convenience: an ignored .env file is loaded as Java properties.
    # Real OS/deployment environment variables still take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5678/commercehub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      # Shared by cache, rate limits and chat Pub/Sub when each feature is enabled.
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      repositories:
        # Redis is only used as a shared counter store, not as a Spring Data repository.
        enabled: false
  cache:
    # Keep tests and developers without Redis independent by default.
    # Local/staging/production explicitly opt in with CACHE_TYPE=redis.
    type: ${CACHE_TYPE:none}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_ACCESS_EXPIRATION_MS:900000} # Access Token 15 phút
  refreshExpiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # Refresh Token 7 ngày

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:commercehub_refresh}
    # Localhost chạy HTTP phải để false. Production bắt buộc AUTH_COOKIE_SECURE=true.
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE:604800}


#Local/development: SPRINGDOC_ENABLED=true.
#CI: giữ true vì có contract test kiểm tra /v3/api-docs.
#Production: nên đặt SPRINGDOC_ENABLED=false nếu không muốn công khai cấu trúc API.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

sepay:
  environment: ${SEPAY_ENVIRONMENT:test}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  bank-code: ${SEPAY_BANK_CODE:replace-with-bank-code}
  bank-account-number: ${SEPAY_BANK_ACCOUNT_NUMBER:replace-with-bank-account-number}
  account-name: ${SEPAY_ACCOUNT_NAME:replace-with-account-name}
  qr-base-url: ${SEPAY_QR_BASE_URL:https://vietqr.app/img}
  deposit-ttl-minutes: ${SEPAY_DEPOSIT_TTL_MINUTES:15}
  deposit-expiry-scan-ms: ${SEPAY_DEPOSIT_EXPIRY_SCAN_MS:60000}
  create-cooldown-seconds: ${SEPAY_CREATE_COOLDOWN_SECONDS:10}
  max-creates-per-fifteen-minutes: ${SEPAY_MAX_CREATES_PER_15_MINUTES:5}
  max-creates-per-day: ${SEPAY_MAX_CREATES_PER_DAY:20}

commercehub:
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:commercehub:local:cache}
    default-ttl: ${CACHE_DEFAULT_TTL:60s}
    active-categories-ttl: ${CACHE_ACTIVE_CATEGORIES_TTL:15m}
    best-selling-products-ttl: ${CACHE_BEST_SELLING_PRODUCTS_TTL:60s}
    public-product-pages-ttl: ${CACHE_PUBLIC_PRODUCT_PAGES_TTL:60s}
    public-shops-ttl: ${CACHE_PUBLIC_SHOPS_TTL:2m}
  cors:
    # Comma-separated so a domain migration only changes deployment secrets/config.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jobs:
    batch-size: ${JOB_BATCH_SIZE:200}
    # Quét mỗi phút để đơn quá hạn 24 giờ được hoàn tiền gần sát deadline.
    order-expiry-cron: "${ORDER_EXPIRY_CRON:0 * * * * *}"
  dispute:
    seller-response-hours: ${DISPUTE_SELLER_RESPONSE_HOURS:24}
    warranty-processing-hours: ${DISPUTE_WARRANTY_PROCESSING_HOURS:24}
    buyer-confirmation-hours: ${DISPUTE_BUYER_CONFIRMATION_HOURS:24}
    admin-review-hours: ${DISPUTE_ADMIN_REVIEW_HOURS:72}
  chat:
    redis-pubsub-enabled: ${CHAT_REDIS_PUBSUB_ENABLED:false}
    redis-channel: ${CHAT_REDIS_CHANNEL:commercehub:local:chat:events}
    rate-limit-key-prefix: ${CHAT_RATE_LIMIT_KEY_PREFIX:commercehub:local:chat:rate-limit}
    max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:2000}
    max-messages-per-window: ${CHAT_MAX_MESSAGES_PER_WINDOW:20}
    rate-limit-window: ${CHAT_RATE_LIMIT_WINDOW:10s}

storage:
  r2:
    # Disabled by default so tests and developers without Cloudflare credentials still boot.
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    # Example: https://images.tienhoclaptrinh.site (no trailing slash required).
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    presign-duration-seconds: ${R2_PRESIGN_DURATION_SECONDS:300}
    max-image-size-bytes: ${R2_MAX_IMAGE_SIZE_BYTES:2097152}
    product-image-width: ${R2_PRODUCT_IMAGE_WIDTH:1200}
    product-image-height: ${R2_PRODUCT_IMAGE_HEIGHT:900}
    avatar-max-image-size-bytes: ${R2_AVATAR_MAX_IMAGE_SIZE_BYTES:1048576}
    avatar-image-width: ${R2_AVATAR_IMAGE_WIDTH:512}
    avatar-image-height: ${R2_AVATAR_IMAGE_HEIGHT:512}
    image-cache-control: ${R2_IMAGE_CACHE_CONTROL:public, max-age=31536000, immutable}
    create-cooldown-seconds: ${R2_UPLOAD_COOLDOWN_SECONDS:3}
    max-presigns-per-fifteen-minutes: ${R2_MAX_PRESIGNS_PER_15_MINUTES:20}
    rate-limit-store: ${R2_RATE_LIMIT_STORE:memory}
    rate-limit-key-prefix: ${R2_RATE_LIMIT_KEY_PREFIX:commercehub:r2:presign}

