name: Release Backend Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git tag or commit to publish"
        required: true
        default: "v1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commercehub_release_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commercehub_release_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/commercehub_release_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_TASK_SCHEDULING_ENABLED: "false"
      GOOGLE_CLIENT_ID: release-ci.apps.googleusercontent.com
      JWT_SECRET: Y29tbWVyY2VodWItcmVsZWFzZS1jaS1zZWNyZXQtYXQtbGVhc3QtMzItYnl0ZXM=
      SEPAY_ENVIRONMENT: test
      SEPAY_WEBHOOK_SECRET: release-ci-webhook-secret
      SEPAY_BANK_CODE: MB
      SEPAY_BANK_ACCOUNT_NUMBER: "0000000000"
      SEPAY_ACCOUNT_NAME: COMMERCEHUB RELEASE CI

    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          REF="${{ inputs.source_ref || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve source commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: |
          chmod +x mvnw
          ./mvnw -B --no-transfer-progress verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tienhoclaptrinh2005/commercehub-backend:${{ steps.source.outputs.version }}
            ghcr.io/tienhoclaptrinh2005/commercehub-backend:sha-${{ steps.commit.outputs.sha }}

      - name: Write release summary
        run: |
          echo "### Backend release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${{ steps.source.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.commit.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"