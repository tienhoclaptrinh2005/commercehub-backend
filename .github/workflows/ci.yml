name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commercehub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commercehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/commercehub_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_TASK_SCHEDULING_ENABLED: "false"
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
      GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
      JWT_SECRET: Y29tbWVyY2VodWItY2ktand0LXNlY3JldC1hdC1sZWFzdC0zMi1ieXRlcw==
      SEPAY_ENVIRONMENT: test
      SEPAY_WEBHOOK_SECRET: ci-webhook-secret
      SEPAY_BANK_CODE: MB
      SEPAY_BANK_ACCOUNT_NUMBER: "0000000000"
      SEPAY_ACCOUNT_NAME: COMMERCEHUB CI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Allow Maven Wrapper execution
        run: chmod +x mvnw

      - name: Verify backend
        run: ./mvnw -B --no-transfer-progress verify
